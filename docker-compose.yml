services:
  watch-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transparency_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parliament_watch_db}
    # Keep the existing named volume. Never use down -v on legacy data.
    volumes:
      - watch-db-data:/var/lib/postgresql/data
    networks:
      - parliament-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8002}:8000"
    # Phase 1 deliberately never connects to or changes the legacy database.
    networks:
      - parliament-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3002}:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - parliament-network
    restart: unless-stopped

volumes:
  watch-db-data:

networks:
  parliament-network:
    driver: bridge
